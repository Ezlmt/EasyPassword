[package]
name = "easypassword"
description = "EasyPassword: deterministic password generator with a global shortcut"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "easypassword_app"
crate-type = ["rlib"]

[features]
# Serve the bundled UI (tauri-cli enables this for release builds; making it
# default lets plain `cargo run` / `cargo build` work too).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
easypassword-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
enigo = "0.6"
arboard = "3"
zeroize = "1.8"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

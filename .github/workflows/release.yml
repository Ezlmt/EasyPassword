name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            args: ""
            targets: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bundle
        working-directory: app
        run: npx --yes @tauri-apps/cli@^2 build ${{ matrix.args }}
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find target -path '*/bundle/dmg/*.dmg' -exec cp {} dist/ \;
          find target -path '*/bundle/nsis/*.exe' -exec cp {} dist/ \;
          (cd dist && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

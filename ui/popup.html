<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>EasyPassword</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 14px 16px; height: 100vh; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    header { display: flex; align-items: center; gap: 8px; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; }
    header .spacer { flex: 1; }
    #site { font-size: 17px; padding: 10px 12px; }
    .field { position: relative; }
    #suggestions { position: absolute; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 4px; list-style: none; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / .15); z-index: 10; }
    #suggestions li { padding: 6px 8px; border-radius: 6px; cursor: pointer; }
    #suggestions li.active { background: var(--accent); color: var(--accent-fg); }
    #advanced { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; padding: 10px; background: var(--bg-soft); border-radius: var(--radius); }
    #advanced .full { grid-column: 1 / -1; }
    #advanced input[type="text"], #advanced input[type="number"] { background: var(--bg); padding: 5px 8px; }
    footer { margin-top: auto; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
    footer .spacer { flex: 1; }
    #setup p { margin: 0 0 6px; }
    #setup .grid { display: grid; gap: 8px; }
    #advanced.concat .rule { opacity: .4; pointer-events: none; }
    .tag { display: inline-block; padding: 0 6px; border-radius: 4px; background: var(--bg-soft); border: 1px solid var(--border); }
    .tag.concat { color: var(--warn-fg); background: var(--warn-bg); border-color: transparent; }
  </style>
</head>
<body>
  <header>
    <h1>EasyPassword</h1>
    <span id="fingerprint" class="chip hidden" title="主密钥校验码：在每台设备上应一致"></span>
    <span class="spacer"></span>
    <button class="link" id="open-settings" title="设置">设置</button>
    <button class="link" id="close" title="关闭 (Esc)">✕</button>
  </header>

  <div id="message" class="msg hidden"></div>

  <!-- Main view -->
  <section id="main" class="hidden">
    <div class="field">
      <input id="site" type="text" placeholder="站点，例如 github.com（!! 开头 = 拼接）" autocomplete="off" spellcheck="false" autocapitalize="off">
      <ul id="suggestions" class="hidden"></ul>
    </div>
    <div class="row small muted" style="margin-top:6px">
      <span id="site-info" class="grow"></span>
      <button class="link small" id="toggle-advanced">选项 ▾</button>
    </div>
    <div id="advanced" class="hidden" style="margin-top:6px">
      <div class="checks full">
        <label><input type="radio" name="mode" value="concat">拼接（旧密码）</label>
        <label><input type="radio" name="mode" value="derived">新算法（推荐）</label>
      </div>
      <label class="rule">长度 <input id="adv-length" type="number" min="4" max="128"></label>
      <label class="rule">版本号 <input id="adv-counter" type="number" min="1" title="密码泄露或需要更换时 +1"></label>
      <div class="checks full rule">
        <label><input type="checkbox" id="adv-lower">小写</label>
        <label><input type="checkbox" id="adv-upper">大写</label>
        <label><input type="checkbox" id="adv-digits">数字</label>
      </div>
      <label class="full rule">符号（留空 = 不用符号） <input id="adv-symbols" type="text" spellcheck="false"></label>
      <label class="full">用户名（仅备注） <input id="adv-username" type="text" spellcheck="false"></label>
    </div>
  </section>

  <!-- First-run setup -->
  <section id="setup" class="hidden">
    <p>设置主密钥。所有密码都由它推导，<b>不会被保存</b>，只把推导结果存进系统钥匙串。忘记它就无法找回密码。</p>
    <div class="grid">
      <input id="mk1" type="password" placeholder="主密钥（建议 4 个以上单词或 12 位以上）" autocomplete="off">
      <input id="mk2" type="password" placeholder="再输入一次" autocomplete="off">
      <input id="identity" type="text" placeholder="身份（可选，如邮箱；每台设备须一致）" autocomplete="off" spellcheck="false">
      <input id="concat-prefix" type="password" placeholder="旧版拼接前缀（可选）" autocomplete="off" title="旧版 EasyPassword 配置文件 config.toml 里的 master_key。填写后，新站点默认按「前缀 + 站点名」生成，与旧版 !! 完全一致。">
      <div class="small muted">用过旧版 <code>!!站点</code> 拼接密码？把旧 config.toml 里的 <code>master_key</code> 填进上面一栏即可继续使用。</div>
      <div class="row">
        <span id="setup-hint" class="small muted grow"></span>
        <button class="primary" id="setup-save">保存</button>
      </div>
    </div>
  </section>

  <footer id="hints" class="hidden">
    <span><kbd>Enter</kbd> <span id="hint-primary">输入</span></span>
    <span><kbd id="mod-key">Ctrl</kbd>+<kbd>Enter</kbd> <span id="hint-alt">复制</span></span>
    <span><kbd>Esc</kbd> 关闭</span>
    <span class="spacer"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>

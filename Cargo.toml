[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

# Argon2 with 64 MiB is painfully slow unoptimized; keep tests fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
